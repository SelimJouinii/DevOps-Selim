services:
  mysql-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports: ["3306:3306"]
  spring-app:
    image: selim-devops
    ports: ["8089:8080"]
    depends_on: [mysql-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/test_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
